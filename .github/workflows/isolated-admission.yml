name: Isolated Oxbow admission
on:
  push:
    branches: [experiment/3364be0-isolated-admission]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      VERSION: 1.0.0-dev.g3364be0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Build pinned package and verify harness DLLs
        run: |
          mkdir -p evidence/raw
          git worktree add --detach "$RUNNER_TEMP/product" 3364be058cc81f7c1e3b9fc100038c482757dcac
          git worktree add --detach "$RUNNER_TEMP/harness" 62fc69fd8b70763e8cc297127a41a20061eefef5
          for project in Oxbow.Abstractions Oxbow; do
            dotnet pack "$RUNNER_TEMP/product/src/$project/$project.csproj" -c Release -p:PackageVersion="$VERSION" -o "$RUNNER_TEMP/feed"
          done
          harness="$RUNNER_TEMP/harness/benchmarks/Oxbow.LoadTests"
          dotnet publish "$harness" -c Release -p:OxbowPackageVersion="$VERSION" -p:RestoreAdditionalProjectSources="$RUNNER_TEMP/feed" -o "$harness/bin/Release/publish"
          pub="$harness/bin/Release/publish"
          for lib in Oxbow Oxbow.Abstractions; do
            jq -e --arg key "$lib/$VERSION" '.libraries[$key].type == "package"' "$pub/Oxbow.LoadTests.deps.json"
            unzip -p "$RUNNER_TEMP/feed/$lib.$VERSION.nupkg" "lib/net10.0/$lib.dll" | cmp - "$pub/$lib.dll"
          done
          (cd "$pub" && sha256sum *.dll) > evidence/publish-sha256.txt
          cp "$pub/Oxbow.LoadTests.deps.json" evidence/
          dotnet build-server shutdown
      - name: Select matching container images
        run: |
          pg=postgres@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          net=mcr.microsoft.com/dotnet/runtime@sha256:0a0e20d12b84b081fb737fddb92d8d205edce9ac2dc62796d2aab30f03804498
          docker pull "$pg"
          docker tag "$pg" postgres:17-alpine
          docker pull "$net"
          docker tag "$net" mcr.microsoft.com/dotnet/runtime:10.0
      - name: Run one cold 30-minute profile
        run: bash benchmarks/Oxbow.LoadTests/isolated/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: admission-evidence
          path: evidence/
          retention-days: 14
