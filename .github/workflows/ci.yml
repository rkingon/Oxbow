name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["postgres:16-alpine", "postgres:17-alpine"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/Oxbow.Tests -c Release --no-build
      - run: dotnet test --project tests/Oxbow.IntegrationTests -c Release --no-build
        env:
          OXBOW_POSTGRES_IMAGE: ${{ matrix.postgres }}
      - run: dotnet pack src/Oxbow -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.postgres == 'postgres:17-alpine'
        with:
          name: packages
          path: artifacts/*
